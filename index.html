<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi rutina">
<meta name="theme-color" content="#141614">
<title>Mi rutina personal</title>
<style>
:root{--bg:#141614;--card:#1D211E;--c2:#252A26;--tx:#F2F2ED;--t2:#A4AAA4;--ac:#A4C3A2;--ink:#141614;--bd:#343A35;--dng:#E0968A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#F3EEE4;--card:#FBF8F1;--c2:#EAE3D5;--tx:#2B2B25;--t2:#625F54;--ac:#4A774A;--ink:#FBF8F1;--bd:#D8CFBB;--dng:#A8473B}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto;padding:14px 18px 4px}
.brand{font-size:15px;color:var(--t2);font-weight:600;letter-spacing:.2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;color:var(--t2);font-size:12px;min-height:48px}
nav button[aria-current=true]{color:var(--ac);font-weight:600}
main{max-width:720px;margin:0 auto;padding:6px 18px 24px}
h1{font-size:28px;line-height:1.15;font-weight:650;letter-spacing:-.4px}
h2{font-size:19px;margin-bottom:12px}
h3{font-size:13px;color:var(--t2);font-weight:600;margin:22px 2px 8px}
.mut,small{color:var(--t2);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:14px}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:3px;margin-top:14px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;color:var(--t2);min-height:40px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--bd)}
.pr1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pr1 span{font-size:22px;font-weight:650;color:var(--ac)}
.bar{height:8px;background:var(--c2);border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .35s ease}
.pil,.task{display:flex;align-items:center;gap:12px}
.pil{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 8px 12px 14px;margin-bottom:8px;transition:border-color .2s}
.pil.done{border-color:var(--ac)}
.pi{width:42px;height:42px;border-radius:14px;background:var(--c2);color:var(--ac);display:grid;place-items:center;font-size:20px;flex:none}
.tx{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.pil .tx b{font-size:18px;font-weight:600}
.task{padding:10px 4px 10px 6px;border-top:1px solid var(--bd)}
.task:first-of-type{border-top:0}
.task .tx span{font-size:15.5px}
.task.done .tx span{color:var(--t2);text-decoration:line-through}
.chk{width:34px;height:34px;flex:none;border:2px solid var(--t2);border-radius:11px;display:grid;place-items:center;color:var(--ink);transition:background .15s,border-color .15s}
.task .chk{width:28px;height:28px;border-radius:9px}
.chk svg{width:18px;height:18px;opacity:0;stroke-width:3}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk.on svg{opacity:1}
.chk.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.15)}}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--t2);flex:none}
.ico.sm{width:36px;height:36px}
.ico svg{width:20px;height:20px}
.cat{display:flex;width:100%;align-items:center;justify-content:space-between;padding:6px 2px;min-height:44px;font-weight:600}
.cat span{color:var(--t2);font-weight:400;font-size:13px;display:flex;align-items:center;gap:6px}
.cat svg{width:18px;height:18px;transition:transform .2s}
.cat[aria-expanded=false] svg{transform:rotate(-90deg)}
.info{display:flex;gap:12px;padding:8px 2px;border-top:1px solid var(--bd)}
.info:first-of-type{border-top:0}
.info .t{width:96px;flex:none;color:var(--t2);font-size:13px;padding-top:2px}
.btn{padding:11px 16px;border-radius:12px;background:var(--c2);min-height:44px;border:1px solid var(--bd)}
.btn.pri{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}
.btn.dng{color:var(--dng)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row.sp .btn{flex:1}
.day{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;background:var(--card);border:1px solid var(--bd);border-radius:16px;min-height:56px}
.day.now{border-color:var(--ac)}
.day.fut{opacity:.55}
.day .dl{width:58px;flex:none}
.day .dl b{display:block;font-size:13px;color:var(--t2);font-weight:600}
.dots{display:flex;gap:6px;flex:1}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--t2);display:grid;place-items:center;font-size:12px;color:var(--ink);line-height:1}
.dot.on{background:var(--ac);border-color:var(--ac)}
.pc{width:44px;text-align:right;font-size:14px;color:var(--t2)}
label{display:block;font-size:13px;color:var(--t2);margin-top:12px}
input[type=text],input:not([type]),select,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;background:var(--c2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:16px}
textarea{min-height:84px;resize:vertical}
.chkl{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px;min-height:40px}
.chkl input{width:22px;height:22px;accent-color:var(--ac)}
.err{color:var(--dng);font-size:14px;min-height:0;margin-top:8px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg);border:1px solid var(--bd);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88dvh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--c2);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.li{display:flex;align-items:center;gap:4px;padding:6px 0;border-top:1px solid var(--bd)}
.li .tx{cursor:default}
.li.off .tx{opacity:.5}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:8px;padding:0 6px;margin-left:6px;color:var(--t2)}
.hint{margin-top:10px}
.back{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--c2);padding:10px 14px;border-radius:14px;font-size:14px}
@media(min-width:760px){
 body{padding-bottom:24px}
 .top{max-width:880px;padding-top:18px}
 nav{position:static;order:0;background:none;border:0;padding:0;gap:4px}
 nav button{flex-direction:row;gap:8px;font-size:14px;padding:8px 14px}
 main{max-width:720px}
 #modal{align-items:center}.sheet{border-radius:22px}
 #toast{bottom:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><b class="brand">Mi rutina</b><nav id="nav" aria-label="Secciones"></nav><button class="ico" data-a="v" data-v="set" aria-label="Configuración" id="gear"></button></header>
<main id="app"></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),K='mrp.v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pkey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=pkey(k);d.setDate(d.getDate()+n);return dkey(d)};
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const today=()=>dkey(new Date());
const lab=k=>{const x=pkey(k);return DN[x.getDay()]+', '+x.getDate()+' de '+MN[x.getMonth()]};
const svg=p=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ic={ok:'<path d="M5 12.5l4.5 4.5L19 7"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',pen:'<path d="M5 19l1-4L16 5l3 3L9 18l-4 1zM14 7l3 3"/>',gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',dumb:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',med:'<circle cx="12" cy="6" r="2.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6M8 20h8"/>',star:'<path d="M12 4l2.4 5 5.6.7-4.1 3.8 1.1 5.5L12 16.2 7 19l1.1-5.5L4 9.7 9.6 9z"/>',dots:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',chev:'<path d="M6 9l6 6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',up:'<path d="M6 15l6-6 6 6"/>',dn:'<path d="M6 9l6 6 6-6"/>',l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>'};
$('#gear').innerHTML=svg(ic.gear);

/* ---------- Datos por defecto ---------- */
const T=(id,name,o)=>Object.assign({id,name,desc:'',time:'',dur:'',cat:'o',pillar:false,active:true,custom:false,kind:'task'},o);
const I=(id,name,time,desc)=>({id,name,desc:desc||'',time,dur:'',cat:'info',pillar:false,active:true,custom:false,kind:'info'});
function def(){
 const hyg='Dientes, ducha con crema facial y peinarse';
 return{v:1,prefs:{theme:'dark',closed:{info:1}},
 cats:[{id:'m',name:'Mañana'},{id:'e',name:'Después de entrenar'},{id:'o',name:'Otras tareas'}],
 routines:{
  school:{name:'Escuela',items:[
   I('sc_wake','Despertar','06:00'),
   T('sc_bed','Hacer la cama',{time:'06:05',cat:'m'}),
   T('sc_hyg','Higiene y cuidado personal',{time:'06:15',cat:'m',desc:hyg}),
   T('sc_prep','Vestirme y preparar lo de la escuela',{time:'06:50',cat:'m'}),
   I('sc_school','Escuela','07:15–14:50'),
   I('sc_home','Llegada a casa','15:00–15:20'),
   I('sc_rest','Tiempo libre y descanso','15:30–16:30'),
   T('sc_train','Entrenar',{key:'train',time:'16:35–17:35',dur:'60 min',pillar:true}),
   T('sc_shower','Ducha posterior al entrenamiento',{time:'17:35–18:00',cat:'e'}),
   T('sc_jp','Japonés',{key:'jp',time:'18:00–18:30',dur:'15–30 min',pillar:true}),
   T('sc_med','Meditación',{key:'med',time:'18:30–18:40',dur:'10 min',pillar:true}),
   I('sc_eve','Tarde y noche','Desde las 18:40','Videojuegos, anime, amigos, familia, cena, descanso y deberes si hacen falta.')]},
  free:{name:'Día libre',items:[
   I('fr_wake','Despertar','07:00–09:00','Ventana flexible: las 09:00 son una referencia, no un límite.'),
   T('fr_bed','Hacer la cama',{cat:'m'}),
   T('fr_hyg','Higiene y cuidado personal',{cat:'m',desc:hyg}),
   T('fr_prep','Prepararme para el día',{cat:'m'}),
   T('fr_train','Entrenar',{key:'train',dur:'60 min',pillar:true}),
   T('fr_shower','Ducha posterior al entrenamiento',{dur:'15–25 min',cat:'e'}),
   T('fr_jp','Japonés',{key:'jp',dur:'15–30 min',pillar:true}),
   T('fr_med','Meditación',{key:'med',dur:'10 min',pillar:true}),
   I('fr_free','Tiempo libre','Resto del día','Sin obligaciones por defecto.')]}},
 logs:{},refl:{}}}

/* ---------- Almacenamiento ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},2800)}
function load(){
 let raw=null;
 try{raw=localStorage.getItem(K);if(!raw)return def();const o=JSON.parse(raw);if(!o||!o.routines||!o.logs)throw 0;o.prefs=o.prefs||{theme:'dark',closed:{}};o.prefs.closed=o.prefs.closed||{};o.refl=o.refl||{};return o}
 catch(e){try{if(raw)localStorage.setItem(K+'.backup',raw)}catch(_){}
  if(raw)setTimeout(()=>toast('No se pudieron leer los datos guardados. Se conservó una copia aparte.'),300);return def()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('No se pudo guardar. Revisa el almacenamiento del navegador.');return false}}
let S=load();

/* ---------- Lógica ---------- */
let view='today',sel=null,weekOff=0,stab='school',pop=null,pend=null;
const cur=()=>sel||today();
const setSel=k=>{sel=k===today()?null:k};
const log=(d,mk)=>{if(!S.logs[d]&&mk)S.logs[d]={done:{},names:{},extra:[]};return S.logs[d]};
const rid=d=>{const l=S.logs[d];if(l&&l.routine&&S.routines[l.routine])return l.routine;const w=pkey(d).getDay();return(w===0||w===6)?'free':'school'};
const tasks=d=>{const l=S.logs[d]||{};return[...S.routines[rid(d)].items.filter(i=>i.kind==='task'&&i.active),...(l.extra||[]).map(e=>Object.assign({},e,{kind:'task',extra:true,active:true,pillar:false}))]};
function stats(d){const t=tasks(d),dn=(S.logs[d]||{}).done||{},c=t.filter(i=>dn[i.id]).length;return{t,total:t.length,c,pct:t.length?Math.round(c/t.length*100):0}}
function toggle(id){const d=cur(),l=log(d,1),it=tasks(d).find(i=>i.id===id);if(!it)return;if(l.done[id])delete l.done[id];else{l.done[id]=1;l.names[id]=it.name}save();render()}
const catName=id=>(S.cats.find(c=>c.id===id)||{}).name||'Otras tareas';
const catOk=id=>S.cats.some(c=>c.id===id)?id:'o';
const dup=(list,n,ex)=>list.some(x=>x.id!==ex&&x.kind!=='info'&&x.name.trim().toLowerCase()===n.toLowerCase());

/* ---------- Vistas ---------- */
const chk=it=>'<button class="chk'+(((S.logs[cur()]||{}).done||{})[it.id]?' on':'')+(pop===it.id?' pop':'')+'" role="checkbox" aria-checked="'+(((S.logs[cur()]||{}).done||{})[it.id]?'true':'false')+'" aria-label="'+esc(it.name)+'" data-a="tg" data-id="'+it.id+'">'+svg(ic.ok)+'</button>';
const sub=it=>{const s=[it.time,it.dur,it.desc].filter(Boolean).join(' · ');return s?'<small>'+esc(s)+'</small>':''};
const edBtn=(it,s)=>'<button class="ico sm" data-a="ed" data-id="'+it.id+'" data-s="'+s+'" aria-label="Opciones de '+esc(it.name)+'">'+svg(ic.dots)+'</button>';
const sc=(it,s)=>it.extra?'x':s;

function vToday(){
 const d=cur(),r=rid(d),R=S.routines[r],st=stats(d),dn=(S.logs[d]||{}).done||{};
 const pil=R.items.filter(i=>i.active&&i.kind==='task'&&i.pillar);
 let h='<h1>'+lab(d)+'</h1><p class="mut" style="margin-top:4px">'+(d===today()?'Un día a la vez.':'Estás viendo un día anterior.')+'</p>';
 if(d!==today())h+='<div class="back"><span>Cambios guardados en esta fecha</span><button class="btn" data-a="now">Volver a hoy</button></div>';
 h+='<div class="seg" role="group" aria-label="Rutina del día">'+['school','free'].map(k=>'<button data-a="rt" data-v="'+k+'" aria-pressed="'+(r===k)+'">'+esc(S.routines[k].name)+'</button>').join('')+'</div>';
 if(st.total){
  const allp=pil.length&&pil.every(i=>dn[i.id]);
  h+='<section class="card" aria-label="Progreso"><div class="pr1"><b>'+st.c+' de '+st.total+' tareas completadas</b><span>'+st.pct+'%</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+st.pct+'" aria-label="Progreso del día"><i style="width:'+st.pct+'%"></i></div><small>'+(st.total-st.c)+' pendientes'+(allp?' · Has dedicado tiempo a '+(pil.length===3?'tus tres pilares':'tus pilares')+'.':'')+'</small></section>';
 }else h+='<section class="card"><b>No hay tareas para este día</b><p class="mut">Añade una o disfruta del tiempo libre.</p></section>';
 if(pil.length){h+='<h3>Mis tres pilares</h3>';
  pil.forEach(it=>{const ico=it.key==='train'?svg(ic.dumb):it.key==='jp'?'あ':it.key==='med'?svg(ic.med):svg(ic.star);
   h+='<div class="pil'+(dn[it.id]?' done':'')+'"><span class="pi" aria-hidden="true">'+ico+'</span><div class="tx" data-a="tg" data-id="'+it.id+'"><b>'+esc(it.name)+'</b>'+sub(it)+'</div>'+edBtn(it,r)+chk(it)+'</div>'});}
 const rest=st.t.filter(i=>!i.pillar);
 if(rest.length){h+='<h3>Rutina personal</h3><div class="card" style="margin-top:0;padding:8px 14px">';
  S.cats.forEach(c=>{const g=rest.filter(i=>catOk(i.cat)===c.id);if(!g.length)return;const open=!S.prefs.closed[c.id],n=g.filter(i=>dn[i.id]).length;
   h+='<button class="cat" data-a="cat" data-id="'+c.id+'" aria-expanded="'+open+'">'+esc(c.name)+'<span>'+n+'/'+g.length+svg(ic.chev)+'</span></button>';
   if(open)h+=g.map(it=>'<div class="task'+(dn[it.id]?' done':'')+'">'+chk(it)+'<div class="tx" data-a="tg" data-id="'+it.id+'"><span>'+esc(it.name)+'</span>'+sub(it)+'</div>'+edBtn(it,sc(it,r))+'</div>').join('')});
  h+='</div>'}
 const inf=R.items.filter(i=>i.active&&i.kind==='info');
 if(inf.length){const open=!S.prefs.closed.info;
  h+='<div class="card" style="padding:6px 14px"><button class="cat" data-a="cat" data-id="info" aria-expanded="'+open+'">Horario de referencia<span>Informativo'+svg(ic.chev)+'</span></button>'+(open?inf.map(i=>'<div class="info"><div class="t">'+esc(i.time)+'</div><div><b>'+esc(i.name)+'</b>'+(i.desc?'<br><small>'+esc(i.desc)+'</small>':'')+'</div></div>').join(''):'')+'</div>'}
 h+='<div class="row sp"><button class="btn pri" data-a="add">+ Añadir tarea</button><button class="btn" data-a="sum" data-d="'+d+'">Resumen del día</button></div>';
 return h}

function vWeek(){
 const td=today(),b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-((b.getDay()+6)%7)+weekOff*7);
 const a=dkey(b),z=addDays(a,6),A=pkey(a),Z=pkey(z);
 let h='<h1>Semana</h1><div class="row" style="align-items:center;justify-content:space-between"><button class="ico" data-a="wk" data-n="-1" aria-label="Semana anterior">'+svg(ic.l)+'</button><div style="text-align:center"><b>'+A.getDate()+' '+MN[A.getMonth()].slice(0,3)+' – '+Z.getDate()+' '+MN[Z.getMonth()].slice(0,3)+'</b>'+(weekOff?'<br><button class="mut" data-a="wk" data-n="0" style="text-decoration:underline">Ir a esta semana</button>':'')+'</div><button class="ico" data-a="wk" data-n="1" aria-label="Semana siguiente">'+svg(ic.r)+'</button></div>';
 let any=false;
 for(let i=0;i<7;i++){const k=addDays(a,i),fut=k>td,l=S.logs[k],st=stats(k),x=pkey(k),show=!fut&&(l||k===td);
  if(l&&(Object.keys(l.done).length||l.extra.length))any=true;
  const dots=show?tasks(k).filter(t=>t.pillar).map(p=>{const on=l&&l.done[p.id];return'<span class="dot'+(on?' on':'')+'" role="img" aria-label="'+esc(p.name)+': '+(on?'hecho':'pendiente')+'">'+(on?'✓':'')+'</span>'}).join(''):'';
  h+='<button class="day'+(k===td?' now':'')+(fut?' fut':'')+'" data-a="day" data-d="'+k+'"><span class="dl"><b>'+DN[x.getDay()].slice(0,3)+'</b>'+x.getDate()+'</span><span class="dots">'+(show?dots:'<small>'+(fut?'Por venir':'Sin registro')+'</small>')+'</span><span class="pc">'+(show&&st.total&&l?st.pct+'%':'')+'</span></button>'}
 if(!any&&weekOff<=0)h+='<p class="mut hint">Aún no hay registros en esta semana.</p>';
 return h}

function vRefl(){
 const d=cur(),r=S.refl[d]||{},td=today();
 const q=[['feel','¿Cómo me sentí hoy?'],['enjoy','¿Qué disfruté de este día?'],['diff','¿Qué me gustaría hacer diferente mañana?'],['free','Notas libres']];
 let h='<h1>Reflexión</h1><div class="row" style="align-items:center;justify-content:space-between"><button class="ico" data-a="dd" data-n="-1" aria-label="Día anterior">'+svg(ic.l)+'</button><b>'+lab(d)+'</b><button class="ico" data-a="dd" data-n="1" aria-label="Día siguiente"'+(d>=td?' disabled style="opacity:.3"':'')+'>'+svg(ic.r)+'</button></div><section class="card">'+q.map(([f,t])=>'<label>'+t+'<textarea data-f="r" data-k="'+f+'">'+esc(r[f]||'')+'</textarea></label>').join('')+'<p class="mut hint" id="rs">Opcional. Se guarda automáticamente.</p></section>';
 const ks=Object.keys(S.refl).filter(k=>k!==d).sort().reverse();
 if(ks.length){h+='<h3>Reflexiones anteriores</h3>'+ks.map(k=>{const o=S.refl[k],t=(o.feel||o.enjoy||o.diff||o.free||'').slice(0,80);return'<button class="day" data-a="rd" data-d="'+k+'"><span class="dl" style="width:auto;flex:1"><b>'+lab(k)+'</b><small>'+esc(t)+'</small></span></button>'}).join('')}
 return h}

function vSet(){
 const R=S.routines[stab];
 let h='<h1>Configuración</h1><h3>Apariencia</h3><div class="seg" role="group" aria-label="Tema"><button data-a="th" data-v="dark" aria-pressed="'+(S.prefs.theme==='dark')+'">Oscuro</button><button data-a="th" data-v="light" aria-pressed="'+(S.prefs.theme==='light')+'">Claro</button></div>';
 h+='<h3>Rutinas y hábitos</h3><div class="seg" role="group" aria-label="Rutina a editar">'+['school','free'].map(k=>'<button data-a="st" data-v="'+k+'" aria-pressed="'+(stab===k)+'">'+esc(S.routines[k].name)+'</button>').join('')+'</div>';
 h+='<section class="card"><label>Nombre de la rutina<input data-f="rname" value="'+esc(R.name)+'" maxlength="30"></label><div style="margin-top:10px">'+R.items.map((it,i)=>'<div class="li'+(it.active?'':' off')+'"><div class="tx" style="cursor:default"><span>'+esc(it.name)+(it.pillar?'<span class="tag">Pilar</span>':'')+(it.kind==='info'?'<span class="tag">Info</span>':'')+'</span>'+sub(it)+'</div><button class="ico sm" data-a="mv" data-id="'+it.id+'" data-n="-1" aria-label="Subir '+esc(it.name)+'"'+(i?'':' disabled style="opacity:.3"')+'>'+svg(ic.up)+'</button><button class="ico sm" data-a="mv" data-id="'+it.id+'" data-n="1" aria-label="Bajar '+esc(it.name)+'"'+(i<R.items.length-1?'':' disabled style="opacity:.3"')+'>'+svg(ic.dn)+'</button><button class="ico sm" data-a="ed" data-id="'+it.id+'" data-s="'+stab+'" aria-label="Editar '+esc(it.name)+'">'+svg(ic.pen)+'</button></div>').join('')+'</div><div class="row"><button class="btn pri" data-a="add" data-rep="1">+ Añadir a esta rutina</button></div><p class="mut hint">Las tareas desactivadas no aparecen ni cuentan. Su historial se conserva.</p></section>';
 h+='<h3>Categorías</h3><section class="card" style="margin-top:0">'+S.cats.map(c=>'<label>Nombre<input data-f="cname" data-id="'+c.id+'" value="'+esc(c.name)+'" maxlength="30"></label>').join('')+'<div class="row"><button class="btn" data-a="newcat">+ Nueva categoría</button></div></section>';
 h+='<h3>Datos</h3><section class="card" style="margin-top:0"><p class="mut">Todo se guarda solo en este navegador de este dispositivo. No se sincroniza con otros dispositivos ni se envía a ningún servidor. Si borras los datos del sitio, se pierden.</p><div class="row"><button class="btn dng" data-a="restore">Restaurar rutinas originales</button></div></section>';
 return h}

function render(){
 document.documentElement.dataset.theme=S.prefs.theme;
 document.querySelector('meta[name=theme-color]').content=S.prefs.theme==='dark'?'#141614':'#F3EEE4';
 $('#nav').innerHTML=[['today','Hoy',ic.sun],['week','Semana',ic.cal],['refl','Reflexión',ic.pen]].map(([v,n,i])=>'<button data-a="v" data-v="'+v+'" aria-current="'+(view===v)+'">'+svg(i)+'<span>'+n+'</span></button>').join('');
 $('#app').innerHTML=({today:vToday,week:vWeek,refl:vRefl,set:vSet})[view]();pop=null}

/* ---------- Ventanas ---------- */
function modal(h){const m=$('#modal');m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+h+'</div>';m.hidden=false;const i=m.querySelector('input[type=text],input:not([type])');if(i)i.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
function ask(msg,fn){pend=fn;modal('<h2>¿Continuar?</h2><p>'+msg+'</p><div class="row"><button class="btn dng" data-a="yes">Sí, continuar</button><button class="btn" data-a="close">Cancelar</button></div>')}
const catSel=v=>'<label>Categoría<select name="cat">'+S.cats.map(c=>'<option value="'+c.id+'"'+(c.id===catOk(v)?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>';
const find=(id,s)=>s==='x'?((S.logs[cur()]||{}).extra||[]).find(x=>x.id===id):S.routines[s].items.find(x=>x.id===id);
const err=m=>{const e=$('#err');if(e)e.textContent=m};

function openEdit(id,s){
 const it=find(id,s);if(!it)return;const tk=it.kind!=='info';
 modal('<form data-form="edit" data-id="'+id+'" data-s="'+s+'"><h2>Editar</h2><label>Nombre<input name="name" value="'+esc(it.name)+'" maxlength="60" required></label><label>Horario (opcional)<input name="time" value="'+esc(it.time)+'" maxlength="24" placeholder="Ej. 16:35–17:35"></label>'+(tk?'<label>Duración objetivo<input name="dur" value="'+esc(it.dur)+'" maxlength="20" placeholder="Ej. 15–30 min"></label>'+catSel(it.cat):'')+(tk&&s!=='x'?'<label class="chkl"><input type="checkbox" name="pillar"'+(it.pillar?' checked':'')+'> Hábito prioritario (pilar)</label>':'')+(s!=='x'?'<label class="chkl"><input type="checkbox" name="active"'+(it.active?' checked':'')+'> Activa en esta rutina</label>':'')+'<p class="err" id="err" role="alert"></p><div class="row"><button class="btn pri">Guardar</button><button type="button" class="btn" data-a="close">Cancelar</button>'+((it.custom||s==='x')?'<button type="button" class="btn dng" data-a="del" data-id="'+id+'" data-s="'+s+'">Eliminar</button>':'')+'</div></form>')}

function openAdd(rep){
 const r=view==='set'?stab:rid(cur());
 modal('<form data-form="add"><h2>Añadir tarea</h2><label>Nombre<input name="name" maxlength="60" required></label><div class="row" style="margin-top:6px"><label class="chkl" style="margin:0"><input type="radio" name="type" value="once"'+(rep?'':' checked')+'> Solo este día</label><label class="chkl" style="margin:0"><input type="radio" name="type" value="rep"'+(rep?' checked':'')+'> Se repite</label></div><div id="repbox"><label>Rutina<select name="rt">'+['school','free'].map(k=>'<option value="'+k+'"'+(k===r?' selected':'')+'>'+esc(S.routines[k].name)+'</option>').join('')+'</select></label><label class="chkl"><input type="checkbox" name="pillar"> Hábito prioritario (pilar)</label></div><label>Horario (opcional)<input name="time" maxlength="24" placeholder="Ej. 20:00"></label>'+catSel('o')+'<p class="err" id="err" role="alert"></p><div class="row"><button class="btn pri">Añadir</button><button type="button" class="btn" data-a="close">Cancelar</button></div></form>');
 syncAdd()}
function syncAdd(){const f=document.querySelector('form[data-form=add]');if(f)$('#repbox').hidden=f.elements.type.value!=='rep'}

function openSummary(d){
 const td=today(),l=S.logs[d],r=S.refl[d];let h='<h2>'+lab(d)+'</h2>';
 if(d>td)h+='<p class="mut">Este día todavía no llega.</p>';
 else{
  if(l){const st=stats(d),dn=l.done,pend2=st.t.filter(i=>!dn[i.id]),pl=st.t.filter(i=>i.pillar);
   h+='<p><b>'+st.c+' de '+st.total+'</b> tareas completadas ('+st.pct+'%)</p>';
   if(pl.length)h+='<h3>Pilares</h3>'+pl.map(p=>'<div class="chkl">'+(dn[p.id]?'✓ ':'○ ')+esc(p.name)+' <small>'+(dn[p.id]?'hecho':'pendiente')+'</small></div>').join('');
   const names=Object.keys(dn).map(k=>l.names[k]||k);
   h+='<h3>Completadas</h3>'+(names.length?'<p>'+names.map(esc).join(', ')+'</p>':'<p class="mut">Ninguna.</p>');
   h+='<h3>Pendientes</h3>'+(pend2.length?'<p>'+pend2.map(i=>esc(i.name)).join(', ')+'</p>':'<p class="mut">Ninguna.</p>')}
  else h+='<p class="mut">No hay registro de tareas en este día.</p>';
  if(r)h+='<h3>Reflexión</h3>'+[['feel','Cómo me sentí'],['enjoy','Lo que disfruté'],['diff','Lo que haría diferente'],['free','Notas']].filter(x=>r[x[0]]).map(x=>'<p><small>'+x[1]+'</small><br>'+esc(r[x[0]]).replace(/\n/g,'<br>')+'</p>').join('')}
 h+='<div class="row">'+(d<=td?'<button class="btn pri" data-a="open" data-d="'+d+'">Abrir en Hoy</button>':'')+'<button class="btn" data-a="close">Cerrar</button></div>';
 modal(h)}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){closeModal();return}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id;
 switch(a){
  case'v':view=b.dataset.v;render();scrollTo(0,0);break;
  case'tg':pop=id;toggle(id);break;
  case'cat':{const c=S.prefs.closed;if(c[id])delete c[id];else c[id]=1;save();render();break}
  case'rt':log(cur(),1).routine=b.dataset.v;save();render();break;
  case'now':sel=null;render();break;
  case'ed':openEdit(id,b.dataset.s);break;
  case'add':openAdd(b.dataset.rep);break;
  case'close':closeModal();break;
  case'sum':case'day':openSummary(b.dataset.d);break;
  case'open':setSel(b.dataset.d);view='today';closeModal();render();scrollTo(0,0);break;
  case'wk':weekOff=b.dataset.n==='0'?0:weekOff+ +b.dataset.n;render();break;
  case'dd':{const n=addDays(cur(),+b.dataset.n);if(n<=today()){setSel(n);render()}break}
  case'rd':setSel(b.dataset.d);render();scrollTo(0,0);break;
  case'th':S.prefs.theme=b.dataset.v;save();render();break;
  case'st':stab=b.dataset.v;render();break;
  case'mv':{const L=S.routines[stab].items,i=L.findIndex(x=>x.id===id),j=i+ +b.dataset.n;if(i>=0&&j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];save();render()}break}
  case'newcat':{const c={id:'c'+uid(),name:'Nueva categoría'};S.cats.push(c);save();render();break}
  case'del':ask('Se eliminará esta tarea. Los días anteriores conservan su registro.',()=>{const s=b.dataset.s;if(s==='x'){const l=log(cur());l.extra=l.extra.filter(x=>x.id!==id)}else S.routines[s].items=S.routines[s].items.filter(x=>x.id!==id);save();render();toast('Tarea eliminada')});break;
  case'restore':ask('Se restaurarán las dos rutinas y las categorías a sus valores originales. Tu historial, tus registros y tus reflexiones no se borran.',()=>{const d=def();S.routines=d.routines;S.cats=d.cats;save();render();toast('Rutinas restauradas')});break;
  case'yes':{const f=pend;pend=null;closeModal();if(f)f();break}
 }});
document.addEventListener('change',e=>{if(e.target.name==='type')syncAdd()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='tg'&&e.target.tagName==='DIV'){e.preventDefault();toggle(e.target.dataset.id)}});
let rt;
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='rname'){S.routines[stab].name=t.value.trim()||S.routines[stab].name;save()}
 else if(f==='cname'){const c=S.cats.find(x=>x.id===t.dataset.id);if(c&&t.value.trim()){c.name=t.value.trim();save()}}
 else if(f==='r'){const d=cur();clearTimeout(rt);rt=setTimeout(()=>{const o=S.refl[d]||{};o[t.dataset.k]=t.value;if(!['feel','enjoy','diff','free'].some(k=>(o[k]||'').trim()))delete S.refl[d];else S.refl[d]=o;const rs=$('#rs');if(rs)rs.textContent=save()?'Guardado.':'No se pudo guardar.'},400)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form,E=f.elements,n=E.name.value.trim();
 if(!n)return err('Escribe un nombre para la tarea.');
 if(k==='edit'){const s=f.dataset.s,it=find(f.dataset.id,s);if(!it)return closeModal();
  const list=s==='x'?tasks(cur()):S.routines[s].items;if(it.kind!=='info'&&dup(list,n,it.id))return err('Ya existe una tarea con ese nombre.');
  it.name=n;it.time=E.time.value.trim();if(E.dur)it.dur=E.dur.value.trim();if(E.cat)it.cat=E.cat.value;if(E.pillar)it.pillar=E.pillar.checked;if(E.active)it.active=E.active.checked;
  if(it.name&&(S.logs[cur()]||{}).names&&S.logs[cur()].names[it.id])S.logs[cur()].names[it.id]=n}
 else{
  if(E.type.value==='rep'){const r=E.rt.value,L=S.routines[r].items;if(dup(L,n))return err('Ya existe una tarea con ese nombre en esa rutina.');
   L.push(T(uid(),n,{time:E.time.value.trim(),cat:E.cat.value,pillar:E.pillar.checked,custom:true}))}
  else{const d=cur();if(dup(tasks(d),n))return err('Ya existe una tarea con ese nombre hoy.');log(d,1).extra.push({id:uid(),name:n,time:E.time.value.trim(),dur:'',desc:'',cat:E.cat.value})}}
 save();closeModal();render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='today'&&!sel&&!$('#modal').innerHTML)render()});
render();
</script>
</body>
</html>
